apiVersion: apps/v1
kind: Deployment
metadata:
  name: lustre-app-deployment
  namespace: lustre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lustre-app
  template:
    metadata:
      labels:
        app: lustre-app
    spec:
      containers:
      - name:  lustre-app
        image: harbor.phadcloud.local/phadscholar/lustre-app:latest
        ports:
        - containerPort: 8000

apiVersion: v1
kind: Service
metadata:
  name: lustre-app-service
  namespace: lustre
spec:
  type: NodePort
  selector:
    app: lustre-app
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30050