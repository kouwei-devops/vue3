apiVersion: apps/v1
kind: Deployment
metadata:
  name: lustre-python-deployment
  namespace: lustre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lustre-python
  template:
    metadata:
      labels:
        app: lustre-python
    spec:
      containers:
      - name:  lustre-python
        image: harbor.phadcloud.local/lustre/python:latest
        ports:
        - containerPort: 8000

apiVersion: v1
kind: Service
metadata:
  name: lustre-python-service
  namespace: lustre
spec:
  type: NodePort
  selector:
    app: lustre-python
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30050

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lustre-vue3-deployment
  namespace: lustre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lustre-vue3
  template:
    metadata:
      labels:
        app: lustre-vue3
    spec:
      containers:
      - name:  lustre-vue3
        image: harbor.phadcloud.local/lustre/vue3:latest
        ports:
        - containerPort: 80

apiVersion: v1
kind: Service
metadata:
  name: lustre-vue3-service
  namespace: lustre
spec:
  type: NodePort
  selector:
    app: lustre-vue3
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30051