version: "3.9"

services:
  python:
    image: python
    container_name: fastapi
    working_dir: /app
    ports:
      - "8000:8000"
    command: >
      uvicorn main:app --reload --host 0.0.0.0 --port 8000


  vue3-frontend:
    image: vue3       # 你刚构建的生产镜像（dist + nginx）
    container_name: vue3
    ports:
      - "8081:80"
    depends_on:
      - python
    restart: unless-stopped
